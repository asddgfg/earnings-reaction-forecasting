[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mqf-earnings-research"
version = "1.1.0"
description = "Maintained SEC earnings data, text input and forecasting pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "requests>=2.32,<3",
    "pyarrow>=15,<25", "filelock>=3.13,<5", "tzdata>=2024.1", "jsonschema>=4.23,<5",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
model = ["torch>=2.5,<3"]
dev = ["pytest>=8,<9", "ruff>=0.14,<1", "coverage>=7,<8"]
legacy = ["Pillow>=10,<13", "pypdf>=5,<7", "openpyxl>=3.1,<4"]

[project.scripts]
mqf = "mqf_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mqf_research = ["**/PROVENANCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "--import-mode=importlib --strict-markers --strict-config -ra"
markers = ["integration: Explicit read-only checks against retained project files"]
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "tools/**/*.py"]
extend-exclude = [".dev_dependencies", ".venv", ".quality"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["mqf_research"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.paths]
source = ["src/mqf_research", "*/src/mqf_research"]
